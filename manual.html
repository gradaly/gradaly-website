<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradaly.io — User Manual / Manuel Utilisateur (v5.0.1)</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Apple SD Gothic Neo", "Malgun Gothic", "Microsoft YaHei", "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50/50 text-slate-800 antialiased selection:bg-indigo-600 selection:text-white" x-data="manualApp()" x-init="init()">

    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2.5">
                    <a :href="'index.html?lang=' + lang" class="flex items-center gap-2 group">
                        <div class="w-7 h-7 bg-indigo-600 rounded-md flex items-center justify-center text-white font-semibold text-sm group-hover:bg-indigo-700 transition">G</div>
                        <span class="font-semibold text-lg tracking-tight text-slate-900">Gradaly<span class="text-indigo-600">.io</span></span>
                    </a>
                    <span class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-indigo-50 text-indigo-700 border border-indigo-100" x-text="t.badge_manual"></span>
                    <span class="hidden md:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium font-mono bg-slate-100 text-slate-600 border border-slate-200/80">v5.0.1</span>
                </div>

                <div class="flex items-center space-x-3 sm:space-x-4">
                    <a :href="'index.html?lang=' + lang" class="text-[13px] font-medium text-slate-600 hover:text-indigo-600 transition flex items-center gap-1.5">
                        <i class="fas fa-arrow-left text-[11px]"></i>
                        <span x-text="t.back_home"></span>
                    </a>
                    <div class="relative" @click.outside="langMenuOpen = false">
                        <button type="button"
                                @click="langMenuOpen = !langMenuOpen"
                                class="px-2.5 py-1.5 rounded-lg bg-white hover:bg-slate-50 transition text-xs font-medium text-slate-700 border border-slate-200 cursor-pointer inline-flex items-center gap-1.5">
                            <span x-text="currentLangObj.flag"></span>
                            <span class="hidden lg:inline" x-text="currentLangObj.label"></span>
                            <span class="lg:hidden uppercase" x-text="currentLangObj.code"></span>
                            <i class="fas fa-chevron-down text-[9px] text-slate-400 transition-transform duration-150" :class="{'rotate-180': langMenuOpen}"></i>
                        </button>
                        <div x-show="langMenuOpen"
                             x-cloak
                             x-transition.opacity.duration.150ms
                             class="absolute right-0 mt-2 w-44 rounded-xl bg-white border border-slate-200 shadow-lg py-1.5 z-50">
                            <template x-for="item in supportedLanguages" :key="item.code">
                                <button type="button"
                                        @click="setLang(item.code)"
                                        :class="lang === item.code ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-700 hover:bg-slate-50 font-medium'"
                                        class="w-full px-3.5 py-2 text-left text-xs flex items-center justify-between transition cursor-pointer">
                                    <span class="flex items-center gap-2">
                                        <span x-text="item.flag"></span>
                                        <span x-text="item.label"></span>
                                    </span>
                                    <i x-show="lang === item.code" class="fas fa-check text-[10px] text-indigo-600"></i>
                                </button>
                            </template>
                        </div>
                    </div>
                    <a :href="'index.html?lang=' + lang + '#download'" class="hidden sm:inline-flex items-center justify-center px-3.5 py-1.5 rounded-lg text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition" x-text="t.download_btn"></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Light Editorial Header Banner with 2-in-1 Product Guide Switcher -->
    <header class="pt-28 pb-10 bg-gradient-to-b from-slate-50 via-white to-white border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8">
                <div class="max-w-3xl">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-100/90 text-slate-600 border border-slate-200/80 mb-4">
                        <i class="fas fa-book-open text-[11px] text-indigo-500"></i>
                        <span x-text="t.hero_pill"></span>
                    </div>
                    <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold tracking-tight text-slate-900 mb-2.5" x-text="t.hero_title"></h1>
                    <p class="text-sm sm:text-base text-slate-500 leading-relaxed" x-text="t.hero_subtitle"></p>
                </div>

                <!-- Search input -->
                <div class="relative w-full lg:w-96 shrink-0">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text"
                           x-model="search"
                           :placeholder="t.search_placeholder"
                           class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-white border border-slate-200/90 text-slate-800 placeholder-slate-400 text-sm shadow-2xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-400">
                    <button x-show="search.length > 0"
                            @click="search = ''"
                            type="button"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-xs px-2 py-1 cursor-pointer">
                        ✕
                    </button>
                </div>
            </div>

            <!-- 2-in-1 Product Selector Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Manual 1: Exam Grading Mode (Enseignant) -->
                <button type="button"
                        @click="selectGuide('exam')"
                        :class="activeGuide === 'exam' ? 'bg-white border-indigo-300 ring-1 ring-indigo-600/10 shadow-sm' : 'bg-slate-50/60 hover:bg-white border-slate-200/80 hover:border-slate-300'"
                        class="text-left p-5 rounded-2xl border transition cursor-pointer flex items-start gap-4">
                    <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 border border-indigo-100 flex items-center justify-center text-base shrink-0">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex flex-wrap items-center gap-2 mb-1.5">
                            <span class="px-2.5 py-0.5 rounded-md text-[11px] font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100" x-text="t.card_exam_badge"></span>
                        </div>
                        <h2 class="text-base sm:text-lg font-semibold text-slate-900" x-text="t.card_exam_title"></h2>
                        <p class="text-xs sm:text-sm text-slate-500 mt-1 leading-relaxed" x-text="t.card_exam_desc"></p>
                    </div>
                </button>

                <!-- Manual 2: Practice & Self-Assessment QR Mode (Étudiant) -->
                <button type="button"
                        @click="selectGuide('practice')"
                        :class="activeGuide === 'practice' ? 'bg-white border-teal-300 ring-1 ring-teal-600/10 shadow-sm' : 'bg-slate-50/60 hover:bg-white border-slate-200/80 hover:border-slate-300'"
                        class="text-left p-5 rounded-2xl border transition cursor-pointer flex items-start gap-4">
                    <div class="w-10 h-10 rounded-xl bg-teal-50 text-teal-600 border border-teal-100 flex items-center justify-center text-base shrink-0">
                        <i class="fas fa-qrcode"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex flex-wrap items-center gap-2 mb-1.5">
                            <span class="px-2.5 py-0.5 rounded-md text-[11px] font-semibold bg-teal-50 text-teal-700 border border-teal-100" x-text="t.card_practice_badge"></span>
                        </div>
                        <h2 class="text-base sm:text-lg font-semibold text-slate-900" x-text="t.card_practice_title"></h2>
                        <p class="text-xs sm:text-sm text-slate-500 mt-1 leading-relaxed" x-text="t.card_practice_desc"></p>
                    </div>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout: Sidebar + Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex flex-col lg:flex-row gap-10">

            <!-- Sticky Sidebar Table of Contents -->
            <aside class="lg:w-72 shrink-0">
                <div class="lg:sticky lg:top-24 bg-white rounded-2xl border border-slate-200/80 p-4 sm:p-5 max-h-[calc(100vh-7rem)] overflow-y-auto">
                    <!-- Quick Guide Switcher inside Sidebar -->
                    <div class="grid grid-cols-2 gap-1 p-1 bg-slate-100 border border-slate-200/70 rounded-xl mb-4 text-xs">
                        <button type="button"
                                @click="selectGuide('exam')"
                                :class="activeGuide === 'exam' ? 'bg-white text-slate-900 shadow-2xs font-semibold' : 'text-slate-500 hover:text-slate-800 font-medium'"
                                class="py-1.5 px-2 rounded-lg transition cursor-pointer truncate flex items-center justify-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-indigo-600 shrink-0"></span>
                            <span class="truncate" x-text="t.sidebar_exam_mode"></span>
                        </button>
                        <button type="button"
                                @click="selectGuide('practice')"
                                :class="activeGuide === 'practice' ? 'bg-white text-slate-900 shadow-2xs font-semibold' : 'text-slate-500 hover:text-slate-800 font-medium'"
                                class="py-1.5 px-2 rounded-lg transition cursor-pointer truncate flex items-center justify-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-teal-600 shrink-0"></span>
                            <span class="truncate" x-text="t.sidebar_practice_mode"></span>
                        </button>
                    </div>

                    <div class="flex items-center justify-between mb-2">
                        <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400" x-text="t.toc_title"></div>
                    </div>

                    <nav class="space-y-1 text-sm">
                        <template x-for="(sec, idx) in filteredSections" :key="sec.id">
                            <div>
                                <template x-if="sec.partHeader">
                                    <div class="pt-2.5 pb-1 px-2 text-[11px] font-semibold uppercase tracking-wider"
                                         :class="sec.partColor === 'teal' ? 'text-teal-700' : sec.partColor === 'indigo' ? 'text-indigo-600' : 'text-slate-400'"
                                         x-text="sec.partHeader"></div>
                                </template>
                                <!-- Special Sidebar Styling for FAQ -->
                                <template x-if="sec.isFaq">
                                    <div class="mt-3 pt-3 border-t border-slate-200/80">
                                        <a :href="'#' + sec.id"
                                           class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-amber-50/60 hover:bg-amber-50 border border-amber-200/70 text-amber-900 font-medium transition">
                                            <span class="flex items-center gap-2 truncate text-xs sm:text-sm">
                                                <i class="fas fa-question-circle text-amber-600 text-xs shrink-0"></i>
                                                <span class="truncate" x-text="sec.shortTitle"></span>
                                            </span>
                                            <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase bg-amber-100 text-amber-800 shrink-0">FAQ</span>
                                        </a>
                                    </div>
                                </template>
                                <!-- Standard Bullet Styling for Manual Chapters -->
                                <template x-if="!sec.isFaq">
                                    <a :href="'#' + sec.id"
                                       class="flex items-center gap-2.5 px-3 py-1.5 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium transition">
                                        <span class="w-1.5 h-1.5 rounded-full shrink-0"
                                              :class="sec.partColor === 'teal' ? 'bg-teal-500' : 'bg-indigo-500'"></span>
                                        <span class="truncate text-xs sm:text-sm" x-text="sec.shortTitle"></span>
                                    </a>
                                </template>
                            </div>
                        </template>
                    </nav>

                    <div class="mt-5 pt-4 border-t border-slate-100">
                        <div class="p-3.5 rounded-xl bg-indigo-50/50 border border-indigo-100/80 text-xs space-y-1.5">
                            <div class="font-semibold flex items-center gap-1.5 text-indigo-700">
                                <i class="fas fa-shield-alt text-[11px]"></i>
                                <span x-text="t.privacy_box_title"></span>
                            </div>
                            <p class="leading-relaxed text-slate-600" x-text="t.privacy_box_text"></p>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Documentation Chapters -->
            <main class="flex-1 space-y-10 min-w-0">

                <template x-for="(sec, idx) in filteredSections" :key="sec.id">
                    <div class="space-y-4">
                        <template x-if="sec.partBanner">
                            <div class="pt-1">
                                <div class="p-5 sm:p-6 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                                     :class="sec.partColor === 'teal' ? 'bg-teal-50/60 border-teal-200/80' : sec.partColor === 'indigo' ? 'bg-indigo-50/60 border-indigo-200/80' : 'bg-slate-100/70 border-slate-200/80'">
                                    <div class="space-y-1">
                                        <div class="text-[11px] font-semibold uppercase tracking-[0.14em]"
                                             :class="sec.partColor === 'teal' ? 'text-teal-700' : sec.partColor === 'indigo' ? 'text-indigo-600' : 'text-slate-500'"
                                             x-text="sec.partBanner.kicker"></div>
                                        <h2 class="text-lg sm:text-xl font-semibold text-slate-900" x-text="sec.partBanner.title"></h2>
                                        <p class="text-xs sm:text-sm text-slate-600 leading-relaxed" x-text="sec.partBanner.desc"></p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <section :id="sec.id"
                                 class="scroll-mt-24 rounded-2xl border overflow-hidden bg-white"
                                 :class="sec.isFaq ? 'border-amber-200/90 mt-8' : 'border-slate-200/80'">
                            <!-- Section Header -->
                            <div class="px-6 sm:px-7 py-5 border-b flex items-start gap-3.5"
                                 :class="sec.isFaq ? 'bg-amber-50/50 border-amber-200/70' : 'bg-slate-50/60 border-slate-200/70'">
                                <template x-if="sec.isFaq">
                                    <div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-700 border border-amber-200/80 text-base flex items-center justify-center shrink-0">
                                        <i class="fas fa-question-circle"></i>
                                    </div>
                                </template>
                                <template x-if="!sec.isFaq">
                                    <div class="w-2.5 h-2.5 mt-2 rounded-full shrink-0"
                                         :class="sec.partColor === 'teal' ? 'bg-teal-500 ring-4 ring-teal-50' : 'bg-indigo-600 ring-4 ring-indigo-50'"></div>
                                </template>
                                <div>
                                    <div class="flex flex-wrap items-center gap-2">
                                        <span class="text-[11px] font-semibold uppercase tracking-wider"
                                              :class="sec.isFaq ? 'text-amber-700' : sec.partColor === 'teal' ? 'text-teal-600' : 'text-indigo-600'"
                                              x-text="sec.tag"></span>
                                        <template x-if="sec.badge">
                                            <span class="px-2 py-0.5 rounded-md text-[11px] font-medium border"
                                                  :class="sec.isFaq ? 'bg-amber-100/80 text-amber-800 border-amber-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'"
                                                  x-text="sec.badge"></span>
                                        </template>
                                    </div>
                                    <h2 class="text-xl sm:text-2xl font-semibold tracking-tight text-slate-900 mt-0.5" x-text="sec.title"></h2>
                                    <p class="text-sm text-slate-500 mt-1" x-text="sec.subtitle"></p>
                                </div>
                            </div>

                            <!-- Section Body -->
                            <div class="p-6 sm:p-7 space-y-6">
                                <!-- Overview paragraphs -->
                                <div class="space-y-3 text-slate-600 text-sm sm:text-[15px] leading-relaxed">
                                    <template x-for="(p, pIdx) in sec.paragraphs" :key="pIdx">
                                        <p x-html="p"></p>
                                    </template>
                                </div>

                                <!-- Dynamic Language Screenshot(s) -->
                                <template x-if="sec.screenshots && sec.screenshots.length > 0">
                                    <div class="space-y-6 pt-1">
                                        <template x-for="(shot, sIdx) in sec.screenshots" :key="sIdx">
                                            <figure class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-2 sm:p-3">
                                                <div class="flex items-center justify-between px-2 pb-2 text-xs text-slate-500">
                                                    <span class="font-medium text-slate-700 flex items-center gap-1.5">
                                                        <i class="fas fa-desktop text-[11px]" :class="sec.partColor === 'teal' ? 'text-teal-600' : 'text-indigo-600'"></i>
                                                        <span x-text="shot.caption"></span>
                                                    </span>
                                                    <span class="font-mono text-[11px] px-2 py-0.5 rounded bg-white border border-slate-200/80 text-slate-500" x-text="t.screenshot_badge"></span>
                                                </div>
                                                <img :src="'manual-assets/' + shot.filePrefix + '_' + assetLang + '.png'"
                                                     :alt="shot.caption"
                                                     loading="lazy"
                                                     class="w-full rounded-xl border border-slate-200/70 bg-white">
                                            </figure>
                                        </template>
                                    </div>
                                </template>

                                <!-- Numbered Key Callouts / Bullets -->
                                <template x-if="sec.callouts && sec.callouts.length > 0">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
                                        <template x-for="(c, cIdx) in sec.callouts" :key="cIdx">
                                            <div class="p-4 rounded-xl bg-slate-50/70 border border-slate-200/70 flex items-start gap-3">
                                                <span class="w-6 h-6 rounded-md font-semibold text-xs flex items-center justify-center shrink-0 mt-0.5 border"
                                                      :class="sec.partColor === 'teal' ? 'bg-teal-50 text-teal-700 border-teal-100' : 'bg-indigo-50 text-indigo-700 border-indigo-100'"
                                                      x-text="cIdx + 1"></span>
                                                <div class="text-xs sm:text-sm">
                                                    <div class="font-semibold text-slate-900 mb-0.5" x-text="c.title"></div>
                                                    <p class="text-slate-600 leading-relaxed" x-html="c.desc"></p>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- Provider API Key Creation Cards -->
                                <template x-if="sec.providerGuides && sec.providerGuides.length > 0">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
                                        <template x-for="(pg, pgIdx) in sec.providerGuides" :key="pgIdx">
                                            <div class="p-5 rounded-xl border border-slate-200/80 bg-slate-50/70 flex flex-col justify-between space-y-3">
                                                <div class="space-y-2">
                                                    <div class="flex items-center justify-between gap-2">
                                                        <h3 class="font-semibold text-slate-900 text-base flex items-center gap-2">
                                                            <i :class="pg.icon" class="text-indigo-600"></i>
                                                            <span x-text="pg.name"></span>
                                                        </h3>
                                                        <span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-indigo-50 text-indigo-700 border border-indigo-100" x-text="pg.tag"></span>
                                                    </div>
                                                    <p class="text-xs sm:text-sm text-slate-600 leading-relaxed" x-html="pg.desc"></p>
                                                    <ol class="list-decimal list-inside space-y-1 text-xs text-slate-600 pt-1">
                                                        <template x-for="(st, stIdx) in pg.steps" :key="stIdx">
                                                            <li x-html="st"></li>
                                                        </template>
                                                    </ol>
                                                </div>
                                                <template x-if="pg.url">
                                                    <div class="pt-2 border-t border-slate-200/70">
                                                        <a :href="pg.url" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition">
                                                            <span x-text="pg.linkLabel"></span>
                                                            <i class="fas fa-external-link-alt text-[10px]"></i>
                                                        </a>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- FAQ Cards -->
                                <template x-if="sec.faqs && sec.faqs.length > 0">
                                    <div class="space-y-3.5 pt-1">
                                        <template x-for="(faq, fIdx) in sec.faqs" :key="fIdx">
                                            <div class="p-5 rounded-xl bg-slate-50/70 border border-slate-200/80 space-y-2">
                                                <h3 class="text-[15px] font-semibold text-slate-900 flex items-start gap-2.5">
                                                    <span class="w-6 h-6 rounded-md bg-indigo-50 text-indigo-700 border border-indigo-100 font-semibold text-xs flex items-center justify-center shrink-0 mt-0.5">Q</span>
                                                    <span x-text="faq.q"></span>
                                                </h3>
                                                <div class="pl-8 text-xs sm:text-sm text-slate-600 leading-relaxed space-y-2" x-html="faq.a"></div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- Pedagogical Tip Box -->
                                <template x-if="sec.tip">
                                    <div class="p-4 sm:p-5 rounded-xl bg-amber-50/60 border border-amber-200/80 flex items-start gap-3 text-xs sm:text-sm text-amber-950">
                                        <i class="fas fa-lightbulb text-amber-600 text-base shrink-0 mt-0.5"></i>
                                        <div>
                                            <div class="font-semibold mb-0.5" x-text="sec.tip.title"></div>
                                            <p class="leading-relaxed text-amber-900/90" x-text="sec.tip.text"></p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </section>
                    </div>
                </template>

                <!-- Switch Guide Bottom Navigation Card -->
                <div x-show="activeGuide === 'exam' || activeGuide === 'practice'" class="p-6 sm:p-7 rounded-2xl border border-slate-200/80 bg-white flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div>
                        <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400" x-text="t.switch_guide_kicker"></div>
                        <h3 class="text-base sm:text-lg font-semibold text-slate-900 mt-0.5"
                            x-text="activeGuide === 'exam' ? t.card_practice_title : t.card_exam_title"></h3>
                        <p class="text-xs sm:text-sm text-slate-500 mt-1"
                           x-text="activeGuide === 'exam' ? t.card_practice_desc : t.card_exam_desc"></p>
                    </div>
                    <button type="button"
                            @click="selectGuide(activeGuide === 'exam' ? 'practice' : 'exam'); window.scrollTo({top: 0, behavior: 'smooth'})"
                            :class="activeGuide === 'exam' ? 'bg-teal-600 hover:bg-teal-700' : 'bg-indigo-600 hover:bg-indigo-700'"
                            class="px-4 py-2.5 rounded-lg text-white font-medium text-sm transition shrink-0 cursor-pointer flex items-center gap-2">
                        <span x-text="activeGuide === 'exam' ? t.btn_go_practice : t.btn_go_exam"></span>
                        <i class="fas fa-arrow-right text-xs"></i>
                    </button>
                </div>

            </main>
        </div>
    </div>

    <!-- Light Footer (No social links on manual) -->
    <footer class="bg-slate-50 text-slate-500 py-10 border-t border-slate-200/80 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm">

                <span class="font-semibold tracking-tight text-slate-900">Gradaly<span class="text-indigo-600">.io</span></span>
                <span class="text-xs text-slate-400">— v5.0.1</span>
            </div>
            <div class="flex items-center gap-6 text-xs sm:text-sm font-medium">
                <a :href="'index.html?lang=' + lang" class="text-slate-600 hover:text-indigo-600 transition" x-text="t.back_home"></a>
                <a :href="'index.html?lang=' + lang + '#download'" class="text-slate-600 hover:text-indigo-600 transition" x-text="t.download_btn"></a>
            </div>
        </div>
    </footer>
