         x-data="{
            examSlide: 0,
            examTotal: 7,
            timer: null,
            next() {
                this.examSlide = (this.examSlide + 1) % this.examTotal;
                this.resetTimer();
            },
            prev() {
                this.examSlide = (this.examSlide - 1 + this.examTotal) % this.examTotal;
                this.resetTimer();
            },
            goTo(i) {
                this.examSlide = i;
                this.resetTimer();
            },
            resetTimer() {
                clearInterval(this.timer);
                this.timer = setInterval(() => {
                    this.examSlide = (this.examSlide + 1) % this.examTotal;
                }, 8000);
            }
         }"
